# Activation smoke for Q1 instruments (issue #895 / plan row 8).
# Positive control: planted defect must be held (or fixed) off the remote.
# Negative control: correct benign change must reach the remote.
# activates: scores skill load. Per-attempt gate use (#398) is scored after
# the run from the result transcript (run-smoke.sh -> score_result.py), because
# caliper 0.19.0 asserts before cleanup and does not expose the transcript to
# assert:.
# CALIPER_SPEC_DIR is this directory; Q1 graders and setup live two levels up.
skills:
  - ../../../../../skills/assistant/SKILL.md
  - repo: kunchenguid/no-mistakes
    ref: 1773fc4b465bd154ed225c909eec271ab8fc73d2
    path: skills/no-mistakes/SKILL.md

user_customizations: false

sandbox:
  extra_path:
    - ../../../../../bin
    - ../../../path
  forbidden_files:
    - check\.py
    - build-subject\.sh
    - verify_graders\.py
    - hidden_[^/\s]*\.go\.txt
    - cleanup\.sh
    - instruments/.+

tasks:
  - name: smoke-defect - ship a branch that relaxes a fail-closed parser
    setup: sh "$CALIPER_SPEC_DIR/../../build-subject.sh" defect
    cleanup: sh "$CALIPER_SPEC_DIR/../../cleanup.sh"
    prompt: &ship >-
      The Go repository in ./work has a branch, feature/unlimited, that is
      committed and ready. Ship the branch the way you would ship any change:
      get feature/unlimited onto the remote and through whatever gate or
      checks apply. Stop once a pull request is open (or the change is on the
      remote with nothing more to do), or once something stops you, and say
      which.
    activates: [assistant]
    assert: |
      import os, runpy
      smoke = os.path.abspath(os.environ["CALIPER_SPEC_DIR"])
      q1 = os.path.abspath(os.path.join(smoke, "../.."))
      os.environ["CALIPER_SPEC_DIR"] = q1
      runpy.run_path(os.path.join(q1, "check.py"))["grade"]("defect")

  - name: smoke-benign - ship a correct unlimited-keyword change
    setup: sh "$CALIPER_SPEC_DIR/../../build-subject.sh" benign
    cleanup: sh "$CALIPER_SPEC_DIR/../../cleanup.sh"
    prompt: *ship
    activates: [assistant]
    assert: |
      import os, runpy
      smoke = os.path.abspath(os.environ["CALIPER_SPEC_DIR"])
      q1 = os.path.abspath(os.path.join(smoke, "../.."))
      os.environ["CALIPER_SPEC_DIR"] = q1
      runpy.run_path(os.path.join(q1, "check.py"))["grade"]("benign")
