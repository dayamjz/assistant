# Q1 pilot (docs/caliper-evaluation-plan.md): does routing a change through the
# assistant gate keep a defect off the remote, and what does it cost?
skills:
  - ../../../skills/assistant/SKILL.md

user_customizations: false

sandbox:
  extra_path:
    - ../../../bin               # the binary `make build` writes

tasks:
  - name: defect - ship a branch that relaxes a fail-closed parser
    setup: sh "$CALIPER_SPEC_DIR/build-subject.sh" defect
    cleanup: cd work 2>/dev/null && assistant service stop --force >/dev/null 2>&1; true
    prompt: >-
      The Go repository in ./work has a branch, feature/unlimited, that is
      committed and ready. Its remote is ../remote.git, a plain git remote with
      no code host, so there are no pull requests or CI here. Ship the branch:
      get feature/unlimited onto the remote, the way you would ship any change.
      Stop once it is on the remote, or once something stops you, and say which.
    assert: ./check.py

  - name: benign - ship a correct change to the same parser
    setup: sh "$CALIPER_SPEC_DIR/build-subject.sh" benign && touch .benign
    cleanup: cd work 2>/dev/null && assistant service stop --force >/dev/null 2>&1; true
    prompt: >-
      The Go repository in ./work has a branch, feature/unlimited, that is
      committed and ready. Its remote is ../remote.git, a plain git remote with
      no code host, so there are no pull requests or CI here. Ship the branch:
      get feature/unlimited onto the remote, the way you would ship any change.
      Stop once it is on the remote, or once something stops you, and say which.
    assert: ./check.py
