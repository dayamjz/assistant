name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Above the test step's -timeout 30m with room for setup, vet and lint,
    # so go test's own bound is the one that ends a slow package.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # v6 or newer, because v5 reads only go.mod's `go` directive and would
      # install go1.25.0; v6 installs the `toolchain` directive's version when
      # one is present, which go.mod pins for darwin/arm64's race detector
      # (#321), and sets GOTOOLCHAIN=local so no later step switches away.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # The terminal session provider's tests run against a real tmux, and
      # the Test step requires one, so they fail here rather than skip.
      - name: Install tmux
        shell: bash
        run: |
          if ! command -v tmux >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = "macOS" ]; then
              brew install tmux
            else
              sudo apt-get update && sudo apt-get install -y tmux
            fi
          fi
          tmux -V

      # The Linux Test step runs its tests under tini in a process namespace
      # of their own; the Test step says why.
      - name: Install tini
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update && sudo apt-get install -y tini
          tini --version

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod is tidy
        if: matrix.os == 'ubuntu-latest'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      # Cross-compiled, so it needs no Windows runner. It checks that every
      # package and test type-checks for Windows; nothing here runs there.
      # A test file with no build constraint calling a helper from a
      # _unix_test.go file reached main twice before this step existed.
      - name: Vet for Windows
        if: matrix.os == 'ubuntu-latest'
        run: GOOS=windows go vet ./...

      # `make lint` must refuse a missing or wrong-major golangci-lint instead
      # of degrading to `go vet` alone, which would make `make check` green
      # with no lint having run. This proves those refusals still fire.
      - name: Lint guard
        if: matrix.os == 'ubuntu-latest'
        run: make lint-guard-test

      # The leftover guard's own tests. The Test step then proves the guard
      # fails on planted leftovers before it trusts the real comparison.
      - name: Leak guard tests
        run: python3 scripts/leak-check-test.py -v

      # The race detector is the point of this job, so it is not optional.
      # The timeout is explicit because internal/service has run past go
      # test's ten-minute default on a macOS runner, which fails the package
      # with a panic and no assertion having failed.
      # Verbose output goes to a file so a skipped test leaves a trace: a
      # package that skipped its assertions still reads ok, and the step
      # after this one lists every skip with its message.
      # On Linux the tests run in a PID namespace of their own, as this
      # runner's user, with tini as its first process so an orphan is reaped
      # as it is on the host. tini stays root, so the namespace still holds
      # one process whose working directory the tests cannot read: the
      # tests that need a real refused read find it there, and it is the
      # ancestor of every test, which the sweep sets aside. A sleep of the
      # nobody user stands beside the tests for the ones that need another
      # user's process off their parent chain, which the sweep sets aside
      # because it shares no user and refuses a signal. The runner holds processes of its own user
      # whose working directory cannot be read (its systemd user manager,
      # (sd-pam) and a running sudo, #152), and agents.Sweeper refuses to
      # clear while such a process runs, as P6 requires and the owner kept,
      # so on the bare host every test asserting a clear sweep can only skip.
      # In the namespace the process table is the test run's own, so those
      # tests run, and ASSISTANT_REQUIRE_SWEEP_CLEAR turns a skip of theirs
      # into a failure. macOS has no PID namespace and its runner holds the
      # same kind of sudo, so there those tests skip naming it, and the
      # Skipped tests step lists them: a green macOS lane establishes nothing
      # about a relaunch or a sweep that has to clear.
      - name: Test
        shell: bash
        env:
          ASSISTANT_REQUIRE_TMUX: "1"
        run: |
          set -o pipefail
          run=()
          if [ "$RUNNER_OS" = "Linux" ]; then
            export ASSISTANT_REQUIRE_SWEEP_CLEAR=1
            run=(sudo --preserve-env env "PATH=$PATH" "HOME=$HOME"
              unshare --pid --fork --mount-proc tini --
              bash -c 'setpriv --reuid=65534 --regid=65534 --clear-groups sleep infinity &
                uid=$1 gid=$2; shift 2
                exec setpriv --reuid="$uid" --regid="$gid" --init-groups "$@"' bash "$(id -u)" "$(id -g)")
          else
            # macOS's own agents and xcrun write into the per-user temp dir
            # whatever TMPDIR says. With the tests' TMPDIR elsewhere, the
            # guard can set those Apple entries aside there without any
            # chance of covering a test's; it still watches both.
            TMPDIR=$(mktemp -d "$RUNNER_TEMP/tmp.XXXXXX")
            export TMPDIR
          fi
          # P15 per package, on Linux: go test runs each package's test
          # binary through `leak-check.py package` (-exec), which makes itself
          # the binary's child subreaper, so every process the package starts
          # stays in its tree whatever session it moves to, and fails that
          # package naming each one still running once the binary exits, then
          # ends them. macOS has no subreaper; whether its lane enforces P15
          # per package is open (see #492), so there only the comparison
          # below runs.
          # Around the whole run, scripts/leak-check.py also fails naming
          # every runner-user process and temp entry that is new when go test
          # ends. Both snapshots are taken inside the namespace: a second one
          # on the host after tini exits would miss what its teardown killed.
          # The self-test first plants a detached process and a directory and
          # must see this same guard, in this same wrapper, reject both, and
          # on Linux the per-package check fail, name and end a planted
          # process, so a guard that cannot see processes here fails the step
          # instead of passing. Existing processes are matched by pid and
          # start time, not by name; Go's build cache lives outside the
          # watched temp roots. The only things set aside are macOS's own
          # Apple launchd jobs, XPC services and temp entries, each printed;
          # the script says which.
          # Each package the check runs is recorded, and every package go test
          # reports ok must be among them, so a lost -exec fails the step.
          per_package=()
          if [ "$RUNNER_OS" = "Linux" ]; then
            per_package=(-exec "python3 $PWD/scripts/leak-check.py package --")
            export LEAK_CHECK_RECORD="$RUNNER_TEMP/per-package-checked.txt"
          fi
          "${run[@]}" python3 scripts/leak-check.py self-test
          if [ -n "${LEAK_CHECK_RECORD:-}" ]; then : > "$LEAK_CHECK_RECORD"; fi
          "${run[@]}" python3 scripts/leak-check.py run -- \
            go test "${per_package[@]}" -race -count=1 -timeout 30m -v ./... > test.log 2>&1 || status=$?
          if [ "$RUNNER_OS" = "Linux" ]; then
            passed=$(grep -cE '^ok[[:space:]]' test.log || true)
            checked=$(wc -l < "$LEAK_CHECK_RECORD")
            echo "leak-check: $checked package(s) ran through the per-package check; go test reported $passed ok"
            if [ "$checked" -lt "$passed" ] || [ "$passed" -eq 0 ]; then
              echo "::error::fewer packages ran through the per-package check than passed"
              status=${status:-1}
            fi
          fi
          grep -E '^(ok|FAIL|--- FAIL|panic:|\?|LEAK|leak-check:)[[:space:]]' test.log || true
          if [ -n "${status:-}" ]; then
            echo "::group::full test output"
            cat test.log
            echo "::endgroup::"
            exit "$status"
          fi

      - name: Skipped tests
        if: always()
        shell: bash
        run: |
          if [ ! -f test.log ]; then
            echo "The Test step left no output on ${{ matrix.os }}, so whether anything skipped is unknown."
          elif grep -q -- '--- SKIP' test.log; then
            echo "These tests skipped on ${{ matrix.os }}; each reason is printed above its SKIP line:"
            grep -B3 -- '--- SKIP' test.log
          else
            echo "No test skipped on ${{ matrix.os }}."
          fi

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # v6 for the same toolchain reason as the check job.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # .golangci.yml is a schema version 2 config, which needs action v7 or
      # newer; v6 installs the v1 line and rejects the config before linting.
      # The linter version is pinned so a new release cannot turn a green
      # branch red on its own.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
      # The same lint cross-checked for the other two platforms the module
      # builds for. Build constraints decide which files a run sees, so a
      # symbol read only from a linux || darwin file is unused on Windows and
      # only a run with that GOOS says so (#435). Both are cross-checks on
      # this runner: they type-check and lint, and run nothing there.
      #
      # Each one analyses into a fresh cache of its own. golangci-lint keys a
      # package's cached result by its path and its compiled and ignored
      # files in sequence, with no GOOS in the key, so a package whose
      # constrained files sort last hashes the same for every GOOS, and a
      # cache shared across targets hands Windows the Linux result (#462's
      # review reproduced a Windows-only unused var passing that way).
      # skip-cache is what makes the step's GOLANGCI_LINT_CACHE hold: with
      # caching on, the action sets GOLANGCI_LINT_CACHE to the one directory
      # it restores and saves, ~/.cache/golangci-lint, over the step's own.
      # The cost is that these two steps analyse from nothing on every run.
      - name: golangci-lint (darwin)
        uses: golangci/golangci-lint-action@v9
        env:
          GOOS: darwin
          GOLANGCI_LINT_CACHE: ${{ runner.temp }}/golangci-lint-darwin
        with:
          version: v2.12.2
          skip-cache: true
      - name: golangci-lint (windows)
        uses: golangci/golangci-lint-action@v9
        env:
          GOOS: windows
          GOLANGCI_LINT_CACHE: ${{ runner.temp }}/golangci-lint-windows
        with:
          version: v2.12.2
          skip-cache: true
