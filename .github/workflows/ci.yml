name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Above the test step's -timeout 30m with room for setup, vet and lint,
    # so go test's own bound is the one that ends a slow package.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # Go, tmux and tini: what scripts/ci-test.sh runs the suite with.
      - uses: ./.github/actions/test-env

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod is tidy
        if: matrix.os == 'ubuntu-latest'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      # Cross-compiled, so it needs no Windows runner. It checks that every
      # package and test type-checks for Windows; nothing here runs there.
      # A test file with no build constraint calling a helper from a
      # _unix_test.go file reached main twice before this step existed.
      - name: Vet for Windows
        if: matrix.os == 'ubuntu-latest'
        run: GOOS=windows go vet ./...

      # `make lint` must refuse a missing or wrong-major golangci-lint instead
      # of degrading to `go vet` alone, which would make `make check` green
      # with no lint having run. This proves those refusals still fire.
      - name: Lint guard
        if: matrix.os == 'ubuntu-latest'
        run: make lint-guard-test

      # The leftover guard's own tests. The Test step then proves the guard
      # fails on planted leftovers before it trusts the real comparison.
      - name: Leak guard tests
        run: python3 scripts/leak-check-test.py -v

      # The flake ledger's tests (scripts/flake-ledger.py, which the CI lanes
      # read failures from). They run the real go test, so they come after
      # setup-go; nothing in the parser depends on the platform it runs on.
      - name: Flake ledger tests
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/flake-ledger-test.py -v

      # The race suite in CI's test environment. scripts/ci-test.sh owns that
      # environment (Linux's PID namespace, macOS's TMPDIR, the leak check
      # around the run and per package) and says why each part is there.
      - name: Test
        shell: bash
        run: bash scripts/ci-test.sh

      - name: Skipped tests
        if: always()
        shell: bash
        run: |
          if [ ! -f test.log ]; then
            echo "The Test step left no output on ${{ matrix.os }}, so whether anything skipped is unknown."
          elif grep -q -- '--- SKIP' test.log; then
            echo "These tests skipped on ${{ matrix.os }}; each reason is printed above its SKIP line:"
            grep -B3 -- '--- SKIP' test.log
          else
            echo "No test skipped on ${{ matrix.os }}."
          fi

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # v6 for the toolchain reason .github/actions/test-env gives.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # .golangci.yml is a schema version 2 config, which needs action v7 or
      # newer; v6 installs the v1 line and rejects the config before linting.
      # The linter version is pinned so a new release cannot turn a green
      # branch red on its own.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
      # The same lint cross-checked for the other two platforms the module
      # builds for. Build constraints decide which files a run sees, so a
      # symbol read only from a linux || darwin file is unused on Windows and
      # only a run with that GOOS says so (#435). Both are cross-checks on
      # this runner: they type-check and lint, and run nothing there.
      #
      # Each one analyses into a fresh cache of its own. golangci-lint keys a
      # package's cached result by its path and its compiled and ignored
      # files in sequence, with no GOOS in the key, so a package whose
      # constrained files sort last hashes the same for every GOOS, and a
      # cache shared across targets hands Windows the Linux result (#462's
      # review reproduced a Windows-only unused var passing that way).
      # skip-cache is what makes the step's GOLANGCI_LINT_CACHE hold: with
      # caching on, the action sets GOLANGCI_LINT_CACHE to the one directory
      # it restores and saves, ~/.cache/golangci-lint, over the step's own.
      # The cost is that these two steps analyse from nothing on every run.
      - name: golangci-lint (darwin)
        uses: golangci/golangci-lint-action@v9
        env:
          GOOS: darwin
          GOLANGCI_LINT_CACHE: ${{ runner.temp }}/golangci-lint-darwin
        with:
          version: v2.12.2
          skip-cache: true
      - name: golangci-lint (windows)
        uses: golangci/golangci-lint-action@v9
        env:
          GOOS: windows
          GOLANGCI_LINT_CACHE: ${{ runner.temp }}/golangci-lint-windows
        with:
          version: v2.12.2
          skip-cache: true

  # A re-run that passes turns a run green with the failure it re-ran past
  # out of sight. From the second attempt on, this job lists every failure
  # of the earlier attempts (scripts/flake-ledger.py) and fails for one that
  # no open issue names, so a test may pass on a re-run but never silently.
  # On a first attempt it is skipped, which a required check reads as
  # passing. Re-running failed jobs re-runs this one too, since it needs
  # them.
  reruns:
    name: re-runs
    needs: [check, lint]
    if: ${{ !cancelled() && github.run_attempt > 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - name: Every earlier attempt's failure has an open issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          python3 scripts/flake-ledger.py --repo "$GITHUB_REPOSITORY" --run "$GITHUB_RUN_ID" \
            --require-open-issues --no-cache --tz America/Los_Angeles | tee -a "$GITHUB_STEP_SUMMARY"
