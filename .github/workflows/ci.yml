name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Above the test step's -timeout 30m with room for setup, vet and lint,
    # so go test's own bound is the one that ends a slow package.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The terminal session provider's tests run against a real tmux, and
      # the Test step requires one, so they fail here rather than skip.
      - name: Install tmux
        shell: bash
        run: |
          if ! command -v tmux >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = "macOS" ]; then
              brew install tmux
            else
              sudo apt-get update && sudo apt-get install -y tmux
            fi
          fi
          tmux -V

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod is tidy
        if: matrix.os == 'ubuntu-latest'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      # Cross-compiled, so it needs no Windows runner. It checks that every
      # package and test type-checks for Windows; nothing here runs there.
      # A test file with no build constraint calling a helper from a
      # _unix_test.go file reached main twice before this step existed.
      - name: Vet for Windows
        if: matrix.os == 'ubuntu-latest'
        run: GOOS=windows go vet ./...

      # `make lint` must refuse a missing or wrong-major golangci-lint instead
      # of degrading to `go vet` alone, which would make `make check` green
      # with no lint having run. This proves those refusals still fire.
      - name: Lint guard
        if: matrix.os == 'ubuntu-latest'
        run: make lint-guard-test

      # The race detector is the point of this job, so it is not optional.
      # The timeout is explicit because internal/service has run past go
      # test's ten-minute default on a macOS runner, which fails the package
      # with a panic and no assertion having failed.
      # Verbose output goes to a file so a skipped test leaves a trace: a
      # package that skipped its assertions still reads ok, and the step
      # after this one lists every skip with its message.
      - name: Test
        shell: bash
        env:
          ASSISTANT_REQUIRE_TMUX: "1"
        run: |
          set -o pipefail
          go test -race -count=1 -timeout 30m -v ./... > test.log 2>&1 || status=$?
          grep -E '^(ok|FAIL|--- FAIL|panic:|\?)[[:space:]]' test.log || true
          if [ -n "${status:-}" ]; then
            echo "::group::full test output"
            cat test.log
            echo "::endgroup::"
            exit "$status"
          fi

      - name: Skipped tests
        if: always()
        shell: bash
        run: |
          if [ ! -f test.log ]; then
            echo "The Test step left no output on ${{ matrix.os }}, so whether anything skipped is unknown."
          elif grep -q -- '--- SKIP' test.log; then
            echo "These tests skipped on ${{ matrix.os }}; each reason is printed above its SKIP line:"
            grep -B3 -- '--- SKIP' test.log
          else
            echo "No test skipped on ${{ matrix.os }}."
          fi

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # .golangci.yml is a schema version 2 config, which needs action v7 or
      # newer; v6 installs the v1 line and rejects the config before linting.
      # The linter version is pinned so a new release cannot turn a green
      # branch red on its own.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
