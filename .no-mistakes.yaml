# Validation gate configuration for this repository.
#
# Fields that execute code or select an agent are read from the default branch,
# never from a pushed commit, so a branch cannot choose what runs here.

commands:
  # Deliberately empty. The gate's test step does targeted validation of the
  # change and its intent; the full suite runs in CI, where it belongs.
  test: ""
  lint: "make lint"
  format: "gofmt -w ."

ignore_patterns:
  - "docs/prd.html"

document:
  instructions: |
    docs/prd.html is the specification and changes only by an explicit decision.
    Do not edit it to match the code; if the code and the PRD disagree, that is a
    finding, not a documentation gap.
    README.md owns the introduction and the development commands.
    Package-level doc comments own each package's contract.
    AGENTS.md owns the working agreement for agents in this repository.

review:
  path_instructions:
    # Two rules that hold everywhere rather than in one package. This schema
    # has no repository-wide review key, so the glob is how a shared rule is
    # said: "*" matches every changed path by basename.
    - path: "*"
      instructions: |
        These two apply to every change here, not to one package.
        A finding that asserts absence - no other caller, nothing reads this,
        no other site does X - owes its method: what was searched, over what,
        and with what pattern. An empty result establishes nothing on its own,
        because what a search could not have found is decided by its pattern
        rather than by what it returned. That limit is part of the rule and not
        an excuse from it: a sweep is only as complete as its pattern, so
        naming the pattern is what lets the next reader see the shape of what
        it could not have reached. Reading rather than searching is a method
        too, and is named the same way.
        A finding names a site; ask whether it names a class. The twin of a
        two-branch operation, the other member of a pair, and the sites the
        finding's own reasoning already reaches belong in the finding, and a
        fix applied to the named site alone leaves the defect where that
        reasoning had put it.
        Neither rule catches a reviewer that traces badly: a search can be
        named and still have been for the wrong thing, and a class can be
        enumerated wrong. What answers for that is the separation between
        reviewing and fixing, not a further instruction here.

    - path: "internal/graph/**"
      instructions: |
        This package is the execution engine, and its correctness rules come from
        the PRD rather than from taste. Check three things specifically.
        Every back edge must carry a bound established when the graph is built, so
        a graph with an unbounded cycle fails to construct rather than at run time.
        Two nodes must not be able to write the same state key unless a merge rule
        is declared for it.
        A halt point must stop before its node runs, never inside it, so nothing
        needs to be idempotent on resume.

    - path: "internal/findings/**"
      instructions: |
        Agent output is untrusted input here, so the failure direction matters
        more than the happy path.
        A finding whose action is missing, empty, unrecognized, or not a string
        must become ask; that is P3, not an error path.
        Fix eligibility must stay defined positively as equality with ActionFix,
        so a finding that never went through Normalize is still not fix-eligible.
        Parsing refuses rather than substitutes: a report with no summary is not
        a clean pass, and an unrecognized risk word is not mapped to a neighbor.
        Severity is a deliberate exception, defaulting to warning because it
        never decides who resolves a finding.
        The review stage answers for one rule more, and only through
        ParseReviewReport: a review report is bound to the revision it reports
        and the paths it declared reading. No other stage answers to any of
        it, and a report read through ParseReport is untouched by it.
        A report whose revision is not the one the run asked about is refused
        whole, and that is the only whole-report refusal the binding adds. A
        finding naming a path the evidence set does not hold is refused for
        want of evidence and recorded as a note quoting the claim, never
        dropped and never an error. That refusal is decided by what the finding
        names and not by what it asks for, so it applies to an action P3 would
        have defaulted exactly as it applies to a stated one.
        The demotion runs the other way: a finding that names no path is
        recorded as a note only where the reviewer stated an action this
        package recognizes, because P3 outranks it. That is why the binding
        runs before Normalize and is reachable only through ParseReviewReport,
        and a path that binds a report already normalized, stored, or built by
        hand turns a hold P3 fixed into a note.
        Declaring the whole diff is a permitted answer rather than an error,
        and it forfeits every finding that reaches past the diff. Both halves
        of the comparison, what was read beyond the change and what the change
        touched and nobody declared, are reported every time, empty or not:
        that visibility is the discriminator, so reporting them only when they
        are non-empty removes it.
        A bound review report therefore never comes back with an empty findings
        list, and a review that found nothing is one whose findings are all
        notes.
        What the binding does not do is establish that the reviewer read
        anything. The evidence set is the reviewer's own claim, no path here is
        resolved against a filesystem, and citing is voluntary by the PRD's own
        design, so the forfeit bites only a finding that volunteers its reach
        through a location or a citation. Asking for more is asking this
        package to judge what a finding's reasoning rests on.
        Demand.Guidance is the text the reviewer is held to, so it and the
        binding change together; a reviewer held to a rule nobody stated is a
        trap rather than a check.

    - path: "internal/vcs/**"
      instructions: |
        This is the only package that invokes git, and the environment filter is
        its security surface. Check the filter first.
        A variable that can widen what an operation may run is stripped by
        default; one that can only narrow it is honored. The three keeps the
        package doc names and justifies are the exception; a new keep needs its
        own reason stated, since a kept variable is a trust decision, not an
        omission.
        Every invocation must address its repository explicitly, with --git-dir
        for a bare repository and -C for a working copy, and must stay
        non-interactive: no prompt, no askpass, no editor, no pager.

    - path: "internal/config/**"
      instructions: |
        This configuration selects what runs with the operator's credentials, so
        ambiguity is refused rather than resolved.
        Trust class belongs to the key table row, not to a call site: a key that
        executes code or shapes what a check demands is not settable from a
        pushed branch, except that a pushed branch may set a commands key under
        allow_pushed_commands, which is itself trusted so a branch cannot enable
        itself. A global-only key in a repository file is refused where its
        author sees it, not dropped.
        A document must mean one thing: duplicate members, flat dotted spellings,
        unrecognized keys, and nulls are refusals, and a refusal names the key,
        and the value when a value is what was refused.

    - path: "internal/store/**"
      instructions: |
        This package owns the database, so a schema change and a read-back of an
        old row are where mistakes land.
        A shipped migration is never edited; a new one is appended. The check
        against the recorded copy must compare digested text, not a count, since
        an in-place edit keeps the count. Rows recorded before digests existed
        compare on name and count alone, so do not read that as the rule relaxed.
        Additivity is checked against sqlite's own catalog after the statements
        run, never against the migration's text.
        A column added later reads back as unknown for old rows. A caller may
        substitute a zero on purpose, but nothing here may hand one out.
        No SQL outside this package: the answer to a needed query is an accessor.
        Who resolved a hold records and does not gate. Nothing may read a
        Resolver to decide whether a resolution may proceed: ResolveHold treats
        every member identically and the value changes only what the record
        says afterwards, so a resolution that became refused because of what
        its record would say would be this column deciding something. Reading
        it as an authorization check is how a review comes to file confident
        wrong findings about decisions standing authority permits.
        The closed set is the type rather than a check at the write: one
        unexported field, no conversion into it, and members that are functions
        because a variable is assignable, so nothing decoded from a wire, a
        configuration file, or an agent's output is a Resolver. Giving it the
        defined string type every other vocabulary here uses would open it. The
        write and the read run off one table, so the column cannot come to hold
        a value a read would refuse, and the zero Resolver names nobody and is
        refused rather than stored.
        What keeps the person value out of a record is where it may be written
        rather than anything checked at the write: ResolveHold records the
        Resolver its caller names and weighs nothing about the surface that
        caller speaks for. The absent check is not the gap to report; the rule
        is that only a surface which witnessed a person may name that value,
        and this repository has none. ResolvedBy is unknown for an open hold
        and for one resolved before the column existed, which is a different
        fact from a resolution nobody is recorded for.

    - path: "internal/agents/**"
      instructions: |
        P4 lives in the types here, not in a rule callers follow. A review
        invocation must have nowhere to put a session: no session field, no
        session parameter, no option that supplies one. Only the fixer carries a
        session across rounds, and it takes no purpose. A new entry point that
        blurs that line is the defect, wherever it is called from.
        A Record carries no prompt, no agent output, no diff, no credential, and
        the type must keep having no field for one; that text belongs on the
        invocation error instead.
        Agent output is parsed by internal/findings only, per P14, and output
        that yields no valid report is an error, never a zero report with nil.
        Shape rides on the shared Invocation, so ShapeReview is a second way to
        say review that the split between the two entry points does not reach.
        Invocation.ValidateForFixer is the one rule that closes it: a review
        shape reaching a session that outlives the round is refused with
        ErrReviewInFixerSession before any process starts, and a fixer path
        asks it instead of Validate. A Shape added later belongs on one side of
        that line the same way an entry point does. Invocation.Validate
        requires Invocation.Review, the findings.Demand, for ShapeReview and
        refuses it for every other shape, so review output cannot be read
        unbound and a demand cannot be attached to output nobody binds. This
        package assembles no prompt, so an invocation whose prompt never stated
        the demand still binds against it; telling the reviewer is the stage's
        job and not a gap here.
        An adapter declares what it supports through Runner.Capabilities, the
        set is the table in capability.go, and undeclared means unavailable: an
        unrecognized capability satisfies nothing, so naming one can only
        refuse a path and never open one. The declaration is read rather than
        derived from the type. Where a capability's row carries a probe,
        Resolve holds declaration and type to each other in both directions and
        ends the whole resolution when they disagree, and OpenFixer consults
        the declaration before the type.
        Two gaps that leaves are worth knowing before reporting one. A row with
        no probe is a declaration taken at its word here, and nothing in this
        package refuses a suppression request because nothing here is asked to
        suppress anything; that refusal is internal/pipeline's, taken when it
        builds the topology. And SessionRunner is exported, so a caller that
        built a Runner itself and asserted on it reaches a session with no
        declaration read at all, which Resolve closes only for a Runner it
        returned.

    - path: "internal/safety/**"
      instructions: |
        This package holds P6, and the trap is anchoring to a tip read just
        before pushing, which always succeeds.
        An anchor is an Observation, and only Guard.Observe or
        RestoreObservedFromCheckpoint may produce one. A restored anchor's
        provenance rests on the checkpoint boundary rather than on the type, so
        a new path that builds a record from a live read defeats it.
        A target that moved since the observation is refused even where nothing
        would be lost.
        Every fact a decision rests on is established or the update is refused:
        an unreadable remote, an unresolvable revision, or a comparison git could
        not answer refuse, and a failed comparison must not report an empty list
        of commits that would be lost.

    - path: "internal/forge/**"
      instructions: |
        Everything provider-specific stays behind Provider, and git stays in
        internal/vcs. The checks model is the part worth reading closely.
        An empty check list is VerdictNoChecks, not a pass. Only a
        NoCIDeclaration built from resolved configuration turns it green, and the
        declaration travels on the result so the evidence stays inspectable.
        Once a check exists the declaration decides nothing.
        A cancelled check is settled and does not pass. An unrecognized state is
        not settled, so the caller keeps waiting; the timeout that bounds that
        wait belongs to the caller.
        A provider that cannot answer returns a typed refusal, never an empty
        list of checks or a missing pull request.

    - path: "internal/ipc/**"
      instructions: |
        Event class is the whole of the overflow policy, so check what a new
        event type is classified as; an unrecognized type is state on purpose.
        Activity is discarded first. A state event may be evicted only when the
        eviction collapses into the sticky gap marker, which is delivered ahead
        of whatever the queue already holds, so a consumer learns it is missing
        something before applying a delta. Control is never discarded: a
        subscription that cannot deliver one ends the stream, and the stalled and
        undeliverable errors stay distinct values.
        Authority over a request comes from Credentials read off the socket,
        never from Marker, which a caller writes for itself.

    - path: "internal/gate/**"
      instructions: |
        This package broke its own written rules until they were given
        mechanisms, so watch for a rule reintroduced as a paragraph.
        No exported operation takes a gate's path. Every one obtains its handle
        from the single seam that resolves the gate, settles ownership, and seals
        it, so an operation added later cannot skip any of that.
        Nothing this package produced is evidence of ownership: neither the
        assistant remote nor the path hash is weighed. Ownership is asked of the
        store's index and the gate's own record, and every answer either gives is
        checked against the working copy actually standing there.
        Whatever a guard or a message owes an operator on one side of an
        operation, its sibling owes too, and a refusal names an action that
        succeeds from where the reader stands rather than one that refuses again.
